<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font: 13px/1.45 Inter, system-ui, sans-serif; width: 260px; margin: 0; padding: 16px; color: #171717; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  #status { padding: 10px 12px; border-radius: 10px; background: #f5f5f5; margin-bottom: 12px; }
  #status.ok { background: #ecfdf5; color: #047857; }
  #status.bad { background: #fff1f2; color: #be123c; }
  button { width: 100%; height: 34px; border: 0; border-radius: 999px; background: #0A66C2; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #004182; }
</style>
</head>
<body>
  <h1>LinkedIn → Strategic CRM</h1>
  <div id="status">Checking…</div>
  <button id="sync">Sync now</button>
  <script src="popup.js"></script>
</body>
</html>
